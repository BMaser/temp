<style>
:root{
  --paper:#FAF8F5; --card:#FFFFFF; --ink:#1C1C1C; --ink2:#5B5752; --line:#E2DED8; --accent:#E8331C;
  --m-yellow:#FFE9A8; --m-green:#CDEFD3; --m-red:#FBD0C8; --m-blue:#CFE2FA;
  --b-yellow:#E0B100; --b-green:#2E9E4A; --b-red:#E8331C; --b-blue:#2F6FD0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line)}
header .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
header .brand i{width:14px;height:14px;background:var(--accent);display:inline-block}
header .sp{flex:1}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);background:var(--paper)}
.pill.ok{border-color:#9BD3A8;background:#EAF7ED;color:#1F6E33}
.pill.warn{border-color:#F2C27A;background:#FFF5E3;color:#8A5A00}
button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;color:var(--ink)}
button:hover{border-color:var(--ink2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.wrap{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 54px)}
nav{border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:54px;align-self:start;height:calc(100vh - 54px);overflow:auto}
nav a{display:block;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;margin-bottom:2px}
nav a small{display:block;color:var(--ink2);font-size:12px}
nav a.on{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);padding-left:7px}
nav .count{float:right;font-size:11px;color:var(--accent);font-weight:700}
nav .legend{margin-top:18px;padding:10px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
nav .legend div{display:flex;align-items:center;gap:6px;margin:3px 0}
nav .legend b{width:12px;height:12px;border-radius:3px;display:inline-block}
main{padding:24px 28px 80px;max-width:1240px}
h1{font-size:26px;margin:0 0 6px}
h2{font-size:19px;margin:0}
.lead{color:var(--ink2);margin:0}
/* every annotatable block = content + margin */
.blk{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin:0 0 14px}
.blk>.c{padding:10px 12px;border-left:4px solid transparent;border-radius:4px;position:relative}
.blk:hover>.c{background:rgba(0,0,0,.025)}
.blk.mk-yellow>.c{background:var(--m-yellow);border-left-color:var(--b-yellow)}
.blk.mk-green>.c{background:var(--m-green);border-left-color:var(--b-green)}
.blk.mk-red>.c{background:var(--m-red);border-left-color:var(--b-red)}
.blk.mk-blue>.c{background:var(--m-blue);border-left-color:var(--b-blue)}
.m{font-size:13px}
.tools{display:flex;gap:6px;align-items:center;opacity:0;transition:opacity .12s;margin-bottom:6px}
.blk:hover .tools,.blk:focus-within .tools,.blk.has .tools{opacity:1}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.dot.on{box-shadow:0 0 0 2px var(--ink)}
.tools button{padding:2px 9px;font-size:12px}
.note{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.note q{display:block;font-size:12px;color:var(--ink2);border-left:3px solid var(--line);padding-left:6px;margin-bottom:4px;quotes:none}
.note textarea{width:100%;min-height:54px;border:0;resize:vertical;font:inherit;font-size:13px;background:transparent;color:var(--ink);outline:none}
.note .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2)}
.note .meta button{border:0;padding:0;font-size:11px;color:var(--accent);background:none}
/* section tables built as grids so each row takes notes */
.thead,.trow{display:grid;grid-template-columns:2.2fr 2.4fr 1.3fr 1.6fr;gap:10px}
.thead{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em;padding:0 12px 4px;border-bottom:2px solid var(--ink)}
.thead.wide{margin-right:318px}
.trow{font-size:14px}
.trow .n{font-weight:600}
.trow .pic{color:var(--ink2)}
.trow .re{color:var(--ink2);font-size:13px}
.thead.tt,.trow.tt{grid-template-columns:1.6fr 0.9fr 0.8fr 3fr}
.thead.gp,.trow.gp{grid-template-columns:1.3fr 1.8fr 1.8fr 1.7fr 0.8fr}
a.sample{display:block;font-weight:700;color:var(--accent);font-size:13px;margin-top:2px}
.thead.src,.trow.src{grid-template-columns:2.4fr 2.4fr 0.9fr 2fr}
.trow.src a{color:var(--ink)}
.terms{margin-top:18px}
.addrow{margin:6px 0 18px;padding-left:12px}
.addrow button{border-style:dashed}
.prop{border:2px dashed #7A3FC0;border-radius:8px;padding:8px 10px;background:#FBF8FF}
.ptag{font-size:11px;font-weight:700;color:#7A3FC0;letter-spacing:.05em;display:flex;justify-content:space-between}
.ptag .pdel{border:0;padding:0;font-size:11px;color:var(--accent);background:none}
.ptitle{width:100%;font:inherit;font-weight:600;font-size:15px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 0;margin:4px 0;outline:none}
.pbody{width:100%;min-height:60px;font:inherit;font-size:14px;border:0;background:transparent;resize:vertical;outline:none}
.chap{margin:34px 0 8px}
.chap .tag{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.05em}
table.t{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);border-bottom:2px solid var(--ink);padding:6px 8px}
table.t td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
figure{margin:0}
figcaption{font-size:12px;color:var(--ink2);margin-top:4px}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.help ol{margin:4px 0 0;padding-left:20px}
@media (max-width:1000px){
  .wrap{grid-template-columns:1fr} nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  nav a{display:inline-block} nav .legend{display:none}
  .blk{grid-template-columns:1fr} .thead.wide{margin-right:0} main{padding:16px}
  .thead,.trow{grid-template-columns:1fr 1fr}
}
</style>

function citeHtml(text){            // escape the text and put the [n] after every source it names
  const e = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  let s = String(text), out = "";
  while (s) {
    let best = null;
    for (const r of CITE_RULES) { const m = r[0].exec(s); if (m && (!best || m.index < best.m.index)) best = {m, r}; }
    if (!best) { out += e(s); break; }
    const {m, r} = best, loc = r[2] ? m[r[2]] : "";
    const shown = loc ? m[0].slice(0, m[0].length - loc.length).trimEnd() : m[0];
    out += e(s.slice(0, m.index)) + e(shown) + " " + cite(r[1], loc);
    s = s.slice(m.index + m[0].length);
  }
  return out;
}

    const [h] = await showOpenFilePicker({types:[{description:"Notes",accept:{"application/json":[".json"]}}]});
    if ((await h.requestPermission({mode:"readwrite"})) !== "granted") return;
    const local = state;
    await readFile(h);
    // keep anything typed here that the file does not have yet
    for (const [k,v] of Object.entries(local.notes||{})) if (!state.notes[k]) state.notes[k]=v;
    state.proposals = state.proposals || [];
    for (const pr of (local.proposals||[])) if (!state.proposals.some(x=>x.id===pr.id)) state.proposals.push(pr);
    fileHandle = h; await idb.set("handle", h).catch(()=>{});
    save(); render();
  } catch(e) { if (e.name!=="AbortError") alert("Could not open the file: "+e.message); }
}
async function reconnect(){
  try {
    const h = await idb.get("handle"); if (!h) return false;
    const p = await h.queryPermission({mode:"readwrite"});
    if (p === "granted") { fileHandle = h; await readFile(h); setStatus("ok","Connected to "+h.name); return true; }
    document.getElementById("connect").textContent = "Reconnect "+h.name;
    document.getElementById("connect").onclick = async () => {
      if ((await h.requestPermission({mode:"readwrite"})) === "granted") {
        fileHandle = h; await readFile(h); document.getElementById("connect").textContent="Connect notes.json";
        document.getElementById("connect").onclick = connect; setStatus("ok","Connected to "+h.name); render();
      }
    };
  } catch(e) {}
  return false;
}

const $ = (t, a={}, ...kids) => { const e=document.createElement(t);
  for (const [k,v] of Object.entries(a)) { if (k==="class") e.className=v; else if (k==="html") e.innerHTML=v; else if (k.startsWith("on")) e[k]=v; else e.setAttribute(k,v); }
  for (const k of kids) if (k!=null) e.append(k.nodeType?k:document.createTextNode(k)); return e; };
const COLORS = [["yellow","discuss"],["green","good as is"],["red","change this"],["blue","question"]];

function note(id){ return state.notes[id] || (state.notes[id] = {label:labels[id]||id, mark:null, items:[]}); }
function tidy(id){ const n=state.notes[id]; if (n && !n.mark && !n.items.length) delete state.notes[id]; }

/* a block = content on the left, marks + notes on the right */
function blk(id, label, content){
  labels[id] = label;
  const b = $("div",{class:"blk","data-id":id});
  const c = $("div",{class:"c"}, content);
  const m = $("div",{class:"m"});

}
function paintBlock(b){
  const id = b.dataset.id, n = state.notes[id], m = b.querySelector(".m");
  b.className = "blk" + (n&&n.mark ? " mk-"+n.mark : "") + (n&&(n.mark||n.items.length) ? " has":"");
  m.innerHTML = "";

  for (const [col,meaning] of COLORS) {
    const d = $("button",{class:"dot"+(n&&n.mark===col?" on":""), title:meaning, "aria-label":"mark "+meaning,
      style:"background:var(--b-"+col+")", onclick:()=>{ const x=note(id); x.label=labels[id]; x.mark = x.mark===col?null:col; tidy(id); save(); paintBlock(b); }});
    tools.append(d);
  }
  tools.append($("button",{title:"Write a note; select words first to quote them", onclick:()=>addNote(b)},"+ Note"));
  m.append(tools);
  for (const [i,it] of (n?n.items:[]).entries()) {
    const ta = $("textarea",{placeholder:"Your note…", "aria-label":"note"}); ta.value = it.t||"";
    ta.oninput = () => { it.t = ta.value; it.at = new Date().toISOString(); save(); };
    const card = $("div",{class:"note"}, it.q ? $("q",{},"“"+it.q+"”") : null, ta,
      $("div",{class:"meta"}, (it.at||"").slice(0,16).replace("T"," "),
        $("button",{onclick:()=>{ if (!it.t || confirm("Delete this note?")) { n.items.splice(i,1); tidy(id); save(); paintBlock(b); } }},"delete")));

function addNote(b){
  const id = b.dataset.id, sel = window.getSelection();
  let q = "";
  if (sel && sel.rangeCount && b.querySelector(".c").contains(sel.anchorNode)) q = sel.toString().trim().slice(0,300);

function svg(w,h,inner){ return $("div",{html:`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" style="max-width:${w}px">${inner}</svg>`}); }
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function flowFigure(items, opts={}){            // boxes left to right with arrows
  const bw=opts.bw||150, bh=opts.bh||74, gap=34, w=items.length*bw+(items.length-1)*gap+4, h=bh+8;
  let s=`<defs><marker id="ar${opts.key}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1C1C1C"/></marker></defs>`;
  items.forEach((it,i)=>{ const x=2+i*(bw+gap);
    s+=`<rect x="${x}" y="4" width="${bw}" height="${bh}" rx="8" fill="${it.hi?"#FFF1EE":"#fff"}" stroke="${it.hi?"#E8331C":"#1C1C1C"}" stroke-width="${it.hi?2:1.2}"/>`;
    s+=`<text x="${x+bw/2}" y="${4+bh/2-8}" text-anchor="middle" font-size="12" fill="#E8331C" font-weight="700">${esc(it.top)}</text>`;
    s+=`<text x="${x+bw/2}" y="${4+bh/2+10}" text-anchor="middle" font-size="13" font-weight="600" fill="#1C1C1C">${esc(it.mid)}</text>`;
    if (it.bot) s+=`<text x="${x+bw/2}" y="${4+bh/2+27}" text-anchor="middle" font-size="11" fill="#5B5752">${esc(it.bot)}</text>`;
    if (i<items.length-1) s+=`<line x1="${x+bw+3}" y1="${4+bh/2}" x2="${x+bw+gap-4}" y2="${4+bh/2}" stroke="#1C1C1C" stroke-width="1.5" marker-end="url(#ar${opts.key})"/>`;
  });
  return svg(w,h,s);
}
function chevrons(steps){                         // the lesson pattern
  const cw=128, ch=60, w=steps.length*(cw-8)+12, h=ch+42;
  let s="";
  steps.forEach((st,i)=>{ const x=2+i*(cw-8), y=2, p=14;
    const pts=`${x},${y} ${x+cw-p},${y} ${x+cw},${y+ch/2} ${x+cw-p},${y+ch} ${x},${y+ch} ${i?x+p:x},${y+ch/2}`;
    s+=`<polygon points="${pts}" fill="${i%2?"#fff":"#FFF1EE"}" stroke="#E8331C" stroke-width="1.3"/>`;
    s+=`<text x="${x+cw/2+(i?4:-2)}" y="${y+ch/2-4}" text-anchor="middle" font-size="12" font-weight="700" fill="#E8331C">${i+1}</text>`;
    s+=`<text x="${x+cw/2+(i?4:-2)}" y="${y+ch/2+13}" text-anchor="middle" font-size="13" font-weight="600" fill="#1C1C1C">${esc(st[0])}</text>`;
    s+=`<text x="${x+cw/2}" y="${ch+20}" text-anchor="middle" font-size="11" fill="#5B5752">${esc(st[2])}</text>`;
  });
  return svg(w,h,s);
}

     <rect x="290" y="50" width="190" height="80" rx="8" fill="#FFF1EE" stroke="#E8331C" stroke-width="2"/><text x="385" y="80" text-anchor="middle" font-size="14" font-weight="700">Gazebo</text><text x="385" y="100" text-anchor="middle" font-size="12" fill="#5B5752">physics + clock (master)</text><text x="385" y="118" text-anchor="middle" font-size="11" fill="#E8331C">C++ plugin: pose out</text>
     <rect x="580" y="50" width="176" height="80" rx="8" fill="#fff" stroke="#1C1C1C"/><text x="668" y="80" text-anchor="middle" font-size="14" font-weight="700">Project AirSim</text><text x="668" y="100" text-anchor="middle" font-size="12" fill="#5B5752">draws the camera picture</text><text x="668" y="118" text-anchor="middle" font-size="11" fill="#5B5752">Unreal, photo-real</text>
     <line x1="174" y1="75" x2="286" y2="75" stroke="#1C1C1C" stroke-width="1.5" marker-end="url(#arS)"/><text x="230" y="68" text-anchor="middle" font-size="11">motor commands</text>
     <line x1="288" y1="108" x2="176" y2="108" stroke="#1C1C1C" stroke-width="1.5" marker-end="url(#arS)"/><text x="230" y="124" text-anchor="middle" font-size="11">sensors (IMU, GPS)</text>
     <line x1="482" y1="75" x2="576" y2="75" stroke="#1C1C1C" stroke-width="1.5" marker-end="url(#arS)"/><text x="529" y="68" text-anchor="middle" font-size="11">pose each step</text>
     <path d="M668,132 C668,180 87,180 87,134" fill="none" stroke="#1C1C1C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arS)"/><text x="378" y="192" text-anchor="middle" font-size="11">picture → vision → PX4 (camera to control, Ch ${CH("15").no})</text>`),
    $("figcaption",{},`Figure 3. Co-simulation, your choice: Gazebo is the master, Project AirSim only draws. Taught in Ch ${CH("7").no}.`))));
  main.append(blk("ov-lesson","The lesson pattern", $("figure",{}, chevrons(LESSON),
    $("figcaption",{},`Figure 4. Every section follows these ${LESSON.length} steps; the grey line under each step is its form. Part I (theory) skips Try it: its practice is on paper.`))));
  const t = $("table",{class:"t"}, $("tr",{}, ...["Ch","Title","Part","Sections","Problems","Round"].map(h=>$("th",{},h))));
  for (const p of PARTS) for (const c of p.chapters) t.append($("tr",{}, $("td",{},c.no), $("td",{},c.title+(c.key==="fly"?"  (new, your request)":"")), $("td",{},p.short), $("td",{},nSections(c)), $("td",{},problemsIn(c)), $("td",{},c.round)));
  main.append(blk("ov-chapters","Table: all chapters", t));
  const r = $("table",{class:"t"}, $("tr",{}, ...["Round","Chapters","Why"].map(h=>$("th",{},h))));
  for (const [rd,why] of ROUNDS) r.append($("tr",{}, $("td",{},rd), $("td",{},roundText(rd)), $("td",{},why)));
  main.append(blk("ov-rounds","Table: rewrite order", r));
  main.append($("div",{class:"chap"}, blk("ov-review","Review of your suggestions", $("div",{},
    $("div",{class:"tag"},"REVIEW · 2026-10-19"), $("h2",{},"Your suggestions, judged"))))) ;
  const vt = $("table",{class:"t"}, $("tr",{}, $("th",{},"Suggestion"), $("th",{},"Verdict")));
  for (const v of GAP_VERDICT) vt.append($("tr",{}, $("td",{html:citeHtml(v[0])}), $("td",{html:citeHtml(v[1])})));
  main.append(blk("ov-verdict","Table: verdict on suggestions", vt));
  main.append($("div",{class:"chap"}, blk("ov-gaps","Gaps", $("div",{},
    $("div",{class:"tag"},"GAPS · YOU AGREED 2026-10-20 · ALL 16 ARE NOW IN THE CHAPTERS"), $("h2",{},`${GAPS.length} gaps I found, and what to add`))))) ;
  main.append($("div",{class:"thead wide gp"}, $("div",{},"Gap"), $("div",{},"Why it matters"), $("div",{},"What to add"), $("div",{},"Resource"), $("div",{},"Status")));
  GAPS.forEach((g,i) => main.append(blk(`gap-${i+1}`, `Gap ${i+1}: ${g[0]}`, $("div",{class:"trow gp"},
    $("div",{class:"n"}, `${i+1}. ${g[0]}`), $("div",{class:"re"}, g[1]), $("div",{}, g[2]), $("div",{class:"pic", html:citeHtml(g[3])}),
    $("div",{style:`font-weight:600;color:${g[4].startsWith("owned")?"#2E9E4A":g[4].startsWith("free")?"#2F6FD0":"#8A5A00"}`}, g[4])))));
  main.append(blk("ov-q1","Open decision 1", $("div",{}, $("b",{},"Open decision 1. "),"Approve the chapters and the round order, or change them here with marks and notes.")));
  main.append(blk("ov-q2","Open decision 2", $("div",{}, $("b",{},"Open decision 2. "),"May the course pages be built on your PC? Until then pages are edited by hand.")));
}
const PAGES = [{id:"ov", short:"Overview", title:"The plan at a glance"}, ...PARTS];
function renderNav(cur){
  const nav = document.getElementById("nav"); nav.innerHTML="";
  for (const p of PAGES) nav.append($("a",{href:"#"+p.id, class:p.id===cur?"on":"", "data-p":p.id},
    $("span",{class:"count"}), p.short, $("small",{}, p.title)));
  const lg = $("div",{class:"legend"}, $("b",{style:"display:none"}), "Marks");
  for (const [c,m] of COLORS) lg.append($("div",{}, $("b",{style:"background:var(--b-"+c+")"}), m));
  nav.append(lg); renderNavCounts();
}
function renderNavCounts(){
  for (const a of document.querySelectorAll("nav a")) {
    const pid = a.dataset.p; let k=0;
    for (const [id,n] of Object.entries(state.notes)) if (partOf(id)===pid && (n.mark||n.items.some(it=>it.t||it.q))) k++;
    k += (state.proposals||[]).filter(x=>x.part===pid).length;
    a.querySelector(".count").textContent = k ? k : "";
  }
}
function render(keepScroll){
  const cur = (location.hash||"#ov").slice(1), main = document.getElementById("main"), y = window.scrollY;
  main.innerHTML=""; renderNav(cur);
  const p = PARTS.find(x=>x.id===cur);
  if (p) renderPart(p, main); else renderOverview(main);
  window.scrollTo(0, keepScroll===true ? y : 0);
}
window.addEventListener("hashchange", () => render());
document.getElementById("connect").onclick = connect;
document.getElementById("download").onclick = () => {
  const a = $("a",{href:URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:"application/json"})), download:"notes.json"});
  document.body.append(a); a.click(); a.remove();
};
document.getElementById("import").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (d.notes) { state = migrate(Object.assign({version:1}, d)); save(); render(); } }
  catch(err) { alert("Not a notes file: "+err.message); }
};
setStatus("warn","Saved in this browser only — connect notes.json");
reconnect().then(render);
</script>
