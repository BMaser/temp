name: Drone GT

# Drone GT: the new drone model "GT" drawn on the simulated drone (drawing only: no collision, no mass). Pictures of the drone
# from eight sides in four looks, the drone's own camera, three drawing scales, three flights without pictures that must equal each
# other step by step, and two films of the same flight. See tests/crazyflow_drone_gt.py.
#
# Every test step has continue-on-error and the later steps run with if: always(), so one failed step never loses the
# results of the others. Only the last step marks the job as failed.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LSY_REPO: learnsyslab/lsy_drone_racing
  LSY_COMMIT: ac7377baa1cfd8fef1bcdc31eeaebff382f453b7

jobs:
  drone-gt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LSY_REPO }}
          ref: ${{ env.LSY_COMMIT }}
          path: lsy_drone_racing

      # Same step as in track-look.yml. LSY loads its gate from lsy_drone_racing/envs/assets/gate.xml
      # (race_core.py: gate_spec_path). The package is an editable install of this checkout
      # (pyproject.toml: path = ".", editable = true), so copying the new model over the asset
      # files changes what LSY loads. LSY's code is not touched. Every flight checks the hashes again.
      - name: Put the new gate model into the LSY checkout
        run: |
          set -e
          assets=lsy_drone_racing/lsy_drone_racing/envs/assets
          for f in gate.xml gate_top.png gate_bottom.png gate_left.png gate_right.png gate_post_bark.png spring.stl; do
            cp "assets/gates/square/$f" "$assets/$f"
            cmp "assets/gates/square/$f" "$assets/$f"
            sha256sum "$assets/$f"
          done
          git -C lsy_drone_racing status --short

      # MuJoCo loads libEGL / libOSMesa at run time. The pixi environment of lsy_drone_racing does
      # not contain them, and the runner has no graphics driver, so take Mesa's software drawing.
      - name: Install Mesa software drawing libraries
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libgles2 libosmesa6
          ldconfig -p | grep -E "libEGL|libOSMesa|libGL\.so" || true
          ls /usr/share/glvnd/egl_vendor.d || true

      # The default pixi environment has no video encoder, so the test pipes raw pictures into the
      # ffmpeg of the runner (as in flight-video.yml).
      - name: Install ffmpeg
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffmpeg -hide_banner -encoders | grep libx264

      # Same action, pixi version and options as the continuous integration of lsy_drone_racing
      # (.github/workflows/testing.yml). Cache is off so a cache problem cannot hide the test.
      - name: Setup pixi
        id: pixi
        continue-on-error: true
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.70.0
          manifest-path: lsy_drone_racing/pyproject.toml
          environments: default
          activate-environment: false
          locked: true
          cache: false

      # pixi activates the environment first. The sim feature of lsy_drone_racing builds acados
      # in that step (tools/setup_acados.sh), which takes a few minutes the first time.
      - name: Self-test of the model splitter (tools/obj_parts.py)
        id: selftest
        continue-on-error: true
        run: |
          mkdir -p results/drone-gt
          set -o pipefail
          pixi run --locked --manifest-path lsy_drone_racing/pyproject.toml -e default             python tools/obj_parts.py --self-test             2>&1 | tee results/drone-gt/obj_parts_self_test.log

      - name: Self-test of the drone look (tools/drone_look.py)
        id: lookselftest
        if: always()
        continue-on-error: true
        run: |
          mkdir -p results/drone-gt
          set -o pipefail
          pixi run --locked --manifest-path lsy_drone_racing/pyproject.toml -e default             python tools/drone_look.py             2>&1 | tee results/drone-gt/drone_look_self_test.log

      - name: Pictures (7 environments, close-up views, camera, scales)
        id: stills
        if: always()
        continue-on-error: true
        run: |
          mkdir -p results/drone-gt
          set -o pipefail
          pixi run --locked --manifest-path lsy_drone_racing/pyproject.toml -e default             python tests/crazyflow_drone_gt.py stills               --repo lsy_drone_racing --out results/drone-gt --lsy-commit "$LSY_COMMIT"             2>&1 | tee results/drone-gt/stills.log

      - name: Proof flights (3 flights, no pictures)
        id: proof
        if: always()
        continue-on-error: true
        run: |
          mkdir -p results/drone-gt
          set -o pipefail
          pixi run --locked --manifest-path lsy_drone_racing/pyproject.toml -e default             python tests/crazyflow_drone_gt.py proof               --repo lsy_drone_racing --out results/drone-gt --lsy-commit "$LSY_COMMIT"             2>&1 | tee results/drone-gt/proof.log

      - name: Films (GT drone at scale 1.0 and 2.0)
        id: film
        if: always()
        continue-on-error: true
        run: |
          mkdir -p results/drone-gt
          set -o pipefail
          pixi run --locked --manifest-path lsy_drone_racing/pyproject.toml -e default             python tests/crazyflow_drone_gt.py film               --repo lsy_drone_racing --out results/drone-gt --lsy-commit "$LSY_COMMIT"             2>&1 | tee results/drone-gt/film.log

      # The summary reads only the json files, so it runs with the python of the runner and still works
      # when the pixi environment could not be made. It exits with 1 when a check failed; that must not
      # stop the upload, so the step has continue-on-error and the last step decides.
      - name: Summary and result file
        id: summary
        if: always()
        continue-on-error: true
        run: |
          mkdir -p results/drone-gt
          set -o pipefail
          python3 tests/crazyflow_drone_gt.py summary             --out results/drone-gt             --selftest-outcome "${{ steps.selftest.outcome }}"             --look-selftest-outcome "${{ steps.lookselftest.outcome }}"             2>&1 | tee results/drone-gt/summary.log

      - name: Write job summary
        if: always()
        run: |
          if [ -f results/drone-gt/summary.md ]; then
            cat results/drone-gt/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Drone GT"
              echo
              echo "No summary file was written. Outcome of the steps: pixi setup = ${{ steps.pixi.outcome }}, self-tests = ${{ steps.selftest.outcome }} / ${{ steps.lookselftest.outcome }}, pictures = ${{ steps.stills.outcome }}, proof = ${{ steps.proof.outcome }}, films = ${{ steps.film.outcome }}, summary = ${{ steps.summary.outcome }}."
              echo
              echo '```'
              tail -n 40 results/drone-gt/stills.log 2>/dev/null || echo "no stills.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drone-gt-results
          path: results/drone-gt
          if-no-files-found: warn

      # Only this step marks the job as failed. It reads result.json (written by the summary step) and fails
      # when the file is missing or says that a check failed.
      - name: Apply pass rule
        if: always()
        run: python3 tests/crazyflow_drone_gt.py check --result results/drone-gt/result.json
