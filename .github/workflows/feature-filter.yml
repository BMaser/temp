# Tests the offline "Choose your vital features" page.
# Put the contents of this ci folder in a repository folder named feature_filter (the working-directory below),
# with this file at .github/workflows/feature-filter.yml in the repository root. Run it by hand (workflow_dispatch).
name: feature-filter
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Versions and browser
        run: |
          node --version
          B=$(which google-chrome google-chrome-stable chromium chromium-browser chrome 2>/dev/null | head -1)
          if [ -z "$B" ]; then echo "no Chrome found on this runner"; exit 1; fi
          echo "BROWSER=$B" >> "$GITHUB_ENV"
          "$B" --version
      - name: Logic test (no browser)
        working-directory: feature_filter
        run: node test_filter_logic.mjs
      - name: Browser test (headless Chrome, file:/// page, network off)
        working-directory: feature_filter
        env:
          RESULT_DIR: ${{ github.workspace }}/feature_filter/result
        run: node test_filter_browser.mjs
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-filter-result
          path: feature_filter/result
