name: First test

on: workflow_dispatch

permissions:
  contents: read

env:
  # utiasDSL/lsy_drone_racing is now learnsyslab/lsy_drone_racing. Main on 2026-10-12.
  LSY_REPO: learnsyslab/lsy_drone_racing
  LSY_COMMIT: ac7377baa1cfd8fef1bcdc31eeaebff382f453b7
  # Crazyflow is not pinned here: pixi.lock of the commit above pins it (rev d28ec70).
  # Branch a2rl2025 of tudelft/optimal_quad_control_RL, the commit the paper code was saved at.
  MONORACE_REPO: tudelft/optimal_quad_control_RL
  MONORACE_COMMIT: a8d2f604f44ddc0991e977eb66353a12732f9e96

jobs:
  camera:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LSY_REPO }}
          ref: ${{ env.LSY_COMMIT }}
          path: lsy_drone_racing

      # MuJoCo loads libEGL / libOSMesa at run time. The pixi environment of lsy_drone_racing does
      # not contain them, and the runner has no graphics driver, so take Mesa's software drawing.
      - name: Install Mesa software drawing libraries
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libgles2 libosmesa6
          ldconfig -p | grep -E "libEGL|libOSMesa|libGL\.so" || true
          ls /usr/share/glvnd/egl_vendor.d || true

      # Same action, pixi version and options as the continuous integration of lsy_drone_racing
      # (.github/workflows/testing.yml). Cache is off so a cache problem cannot hide the test.
      - name: Setup pixi
        id: pixi
        continue-on-error: true
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.70.0
          manifest-path: lsy_drone_racing/pyproject.toml
          environments: default
          activate-environment: false
          locked: true
          cache: false

      # pixi activates the environment first. The sim feature of lsy_drone_racing builds acados
      # in that step (tools/setup_acados.sh), which takes a few minutes.
      - name: Run camera test
        id: run
        continue-on-error: true
        run: |
          mkdir -p results/camera
          set -o pipefail
          pixi run --locked --manifest-path lsy_drone_racing/pyproject.toml -e default \
            python tests/crazyflow_camera.py \
              --repo lsy_drone_racing --out results/camera --lsy-commit "$LSY_COMMIT" \
            2>&1 | tee results/camera/run.log

      - name: Write summary
        if: always()
        run: |
          if [ -f results/camera/summary.md ]; then
            cat results/camera/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Camera job"
              echo
              echo "No result file was written. Outcome of the steps: pixi setup = ${{ steps.pixi.outcome }}, test = ${{ steps.run.outcome }}."
              echo
              echo '```'
              tail -n 40 results/camera/run.log 2>/dev/null || echo "no run.log either"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-results
          path: results/camera
          if-no-files-found: warn

      # Only this step marks the job as failed. It reads the result file and applies the pass rule.
      - name: Apply pass rule
        if: always()
        run: python3 tests/crazyflow_camera.py --check results/camera/result.json

  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MONORACE_REPO }}
          ref: ${{ env.MONORACE_COMMIT }}
          path: monorace

      # environment.yaml of the repository asks for python=3.10.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # The pip list of environment.yaml, with CPU-only PyTorch instead of pytorch-cuda and
      # opencv-python-headless instead of opencv-python (no screen libraries on the runner).
      # environment.yaml pins no versions except setuptools<81, so pip takes the newest that
      # supports Python 3.10; pip-freeze.txt records what it took.
      - name: Install packages
        id: install
        continue-on-error: true
        run: |
          mkdir -p results/controller
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy sympy matplotlib tensorboard stable-baselines3 gymnasium \
            opencv-python-headless "setuptools<81" wheel jax tabulate
          pip freeze > results/controller/pip-freeze.txt

      - name: Run controller test
        id: run
        continue-on-error: true
        run: |
          mkdir -p results/controller
          set -o pipefail
          python tests/monorace_controller.py --repo monorace --out results/controller \
            2>&1 | tee results/controller/run.log

      - name: Write summary
        if: always()
        run: |
          if [ -f results/controller/summary.md ]; then
            cat results/controller/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Controller job"
              echo
              echo "No result file was written. Outcome of the steps: install = ${{ steps.install.outcome }}, test = ${{ steps.run.outcome }}."
              echo
              echo '```'
              tail -n 40 results/controller/run.log 2>/dev/null || echo "no run.log either"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-results
          path: results/controller
          if-no-files-found: warn

      # Only this step marks the job as failed. It reads the result file and applies the pass rule.
      - name: Apply pass rule
        if: always()
        run: python tests/monorace_controller.py --check results/controller/result.json
