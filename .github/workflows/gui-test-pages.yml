name: gui-test-pages
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          node --version
          B=$(which google-chrome chromium chromium-browser chrome 2>/dev/null | head -1)
          echo "BROWSER=$B" >> "$GITHUB_ENV"
          "$B" --version
      - name: Run the test
        working-directory: gui_pages
        run: node --experimental-websocket pages_test_trusted.mjs
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-pages
          path: |
            gui_pages/pages_*.png
            gui_pages/pages_test_result*.txt
