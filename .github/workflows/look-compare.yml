name: Look compare

# Five looks of the racing simulator (today, magenta, cyan, red, violet) as still pictures, side by side.
# See tests/crazyflow_look_compare.py. The test itself copies the gate files of each look over LSY's asset files in the
# checkout before it starts the child process of that look, so this workflow has no fixed copy step for the gate.
#
# Every test step has continue-on-error and the later steps run with if: always(), so one failed step never loses the
# results of the others. Only the last step marks the job as failed.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LSY_REPO: learnsyslab/lsy_drone_racing
  LSY_COMMIT: ac7377baa1cfd8fef1bcdc31eeaebff382f453b7

jobs:
  look-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LSY_REPO }}
          ref: ${{ env.LSY_COMMIT }}
          path: lsy_drone_racing

      # MuJoCo loads libEGL / libOSMesa at run time. The pixi environment of lsy_drone_racing does
      # not contain them, and the runner has no graphics driver, so take Mesa's software drawing.
      - name: Install Mesa software drawing libraries
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libgles2 libosmesa6
          ldconfig -p | grep -E "libEGL|libOSMesa|libGL\.so" || true
          ls /usr/share/glvnd/egl_vendor.d || true

      # Same action, pixi version and options as the continuous integration of lsy_drone_racing
      # (.github/workflows/testing.yml). Cache is off so a cache problem cannot hide the test.
      - name: Setup pixi
        id: pixi
        continue-on-error: true
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.70.0
          manifest-path: lsy_drone_racing/pyproject.toml
          environments: default
          activate-environment: false
          locked: true
          cache: false

      # Checks of the look files with the standard library (no simulator needed).
      - name: Self test of the look files
        id: local
        continue-on-error: true
        run: |
          mkdir -p results/look-compare
          set -o pipefail
          python3 tools/look_assets.py --self-test 2>&1 | tee results/look-compare/look_assets_self_test.log

      - name: Five looks
        id: run
        if: always()
        continue-on-error: true
        run: |
          mkdir -p results/look-compare
          set -o pipefail
          pixi run --locked --manifest-path lsy_drone_racing/pyproject.toml -e default \
            python tests/crazyflow_look_compare.py run \
              --repo lsy_drone_racing --out results/look-compare --lsy-commit "$LSY_COMMIT" \
            2>&1 | tee results/look-compare/run.log

      # The summary reads only the json files, so it runs with the python of the runner.
      - name: Summary and result file
        id: summary
        if: always()
        continue-on-error: true
        run: |
          mkdir -p results/look-compare
          set -o pipefail
          python3 tests/crazyflow_look_compare.py summary \
            --out results/look-compare --unit-outcome "${{ steps.local.outcome }}" \
            2>&1 | tee results/look-compare/summary.log

      - name: Write job summary
        if: always()
        run: |
          if [ -f results/look-compare/summary.md ]; then
            cat results/look-compare/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Look compare"
              echo
              echo "No summary file was written. Outcome of the steps: pixi setup = ${{ steps.pixi.outcome }}, local = ${{ steps.local.outcome }}, run = ${{ steps.run.outcome }}, summary = ${{ steps.summary.outcome }}."
              echo
              echo '```'
              tail -n 40 results/look-compare/run.log 2>/dev/null || echo "no run.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: look-compare-results
          path: results/look-compare
          if-no-files-found: warn

      # Only this step marks the job as failed.
      - name: Apply pass rule
        if: always()
        run: python3 tests/crazyflow_look_compare.py check --result results/look-compare/result.json
