name: colab-unreal-test
on:
  workflow_dispatch:
    inputs:
      note:
        description: "free text"
        default: ""
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notebook file checks (JSON, every cell compiles, py_compile of the exported script)
        run: |
          mkdir -p out
          python colab_unreal/check_notebook.py racing_drone_unreal_films.ipynb /tmp/script.py 2>&1 | tee out/check_notebook.log
      - name: Python packages for the film code
        run: pip install numpy pillow
      - name: Run the exported script as root with the test switch (-nullrhi, no GPU, no Drive)
        id: run
        continue-on-error: true
        run: |
          sudo mkdir -p /opt/w && sudo chmod 755 /opt/w
          sudo -E env "PATH=$PATH" UNREAL_FILMS_TEST=1 UNREAL_FILMS_WORK=/opt/w UNREAL_FILMS_OUT=$GITHUB_WORKSPACE/out/results \
            python /tmp/script.py 2>&1 | tee out/script_run.log
          exit ${PIPESTATUS[0]}
      - name: Film self-test (films from drawn stand-in pictures, never from a simulator)
        if: always()
        run: |
          sudo chown -R "$USER" out || true
          T=$(find out/results -name track.json | grep airsim | head -n 1)
          echo "track file: $T"
          if [ -n "$T" ]; then python colab_unreal/unreal_films.py --selftest out/films_selftest "$T" 2>&1 | tee out/films_selftest.log; fi
      - name: Collect
        if: always()
        run: |
          sudo chown -R "$USER" out || true
          find /opt/w/runs -maxdepth 3 2>/dev/null | head -n 50 > out/runs_listing.txt || true
          df -h / > out/df.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colab-unreal-test
          path: out
          if-no-files-found: warn
