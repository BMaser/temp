name: Simulator gate

# Five drone simulators measured on the free runner (4 cores, no graphics card): does it install, start with no screen,
# give a drone camera picture, and how fast are physics and camera. One job per simulator; each job writes
# results/<sim>/gate.json and uploads results/<sim>/ as the artifact gate-<sim>. See tests/sim_gate/.

on:
  workflow_dispatch:
    inputs:
      sims:
        description: "Comma separated list of simulators to run"
        required: true
        default: "crazyflow,webots,px4_gazebo,airsim,project_airsim"
      attempt:
        description: "Attempt number of these simulators (recorded in gate.json)"
        required: false
        default: "1"

permissions:
  contents: read

env:
  GATE_ATTEMPT: ${{ inputs.attempt }}
  LSY_REPO: learnsyslab/lsy_drone_racing
  LSY_COMMIT: ac7377baa1cfd8fef1bcdc31eeaebff382f453b7
  PX4_TAG: v1.17.0
  AIRSIM_TAG: v1.8.1
  PASIM_TAG: v1.0.1

jobs:
  crazyflow:
    if: contains(format(',{0},', inputs.sims), ',crazyflow,')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LSY_REPO }}
          ref: ${{ env.LSY_COMMIT }}
          path: lsy_drone_racing
      - run: bash tests/sim_gate/stamp.sh start crazyflow
      - name: Install Mesa software drawing libraries
        id: mesa
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libgles2 libosmesa6
          ldconfig -p | grep -E "libEGL|libOSMesa|libGL\.so" || true
      - name: Setup pixi
        id: pixi
        continue-on-error: true
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.70.0
          manifest-path: lsy_drone_racing/pyproject.toml
          environments: default
          activate-environment: false
          locked: true
          cache: false
      - name: Build the environment (acados) and record versions
        id: install
        continue-on-error: true
        run: |
          mkdir -p results/crazyflow
          set -o pipefail
          pixi run --locked --manifest-path lsy_drone_racing/pyproject.toml -e default \
            python -c "import importlib.metadata as m, mujoco, jax; print('crazyflow', m.version('crazyflow'), 'mujoco', mujoco.__version__, 'jax', jax.__version__)" \
            2>&1 | tee -a results/crazyflow/log.txt
      - name: Stamp install
        if: always()
        run: |
          ok=0
          if [ "${{ steps.pixi.outcome }}" = success ] && [ "${{ steps.install.outcome }}" = success ]; then ok=1; fi
          bash tests/sim_gate/stamp.sh end crazyflow $ok
      - name: Gate
        id: gate
        continue-on-error: true
        run: |
          set -o pipefail
          pixi run --locked --manifest-path lsy_drone_racing/pyproject.toml -e default \
            python tests/sim_gate/crazyflow_gate.py run --repo lsy_drone_racing --out results/crazyflow --commit "$LSY_COMMIT" \
            2>&1 | tee -a results/crazyflow/log.txt
      - name: Finalize
        if: always()
        run: python3 tests/sim_gate/common.py finalize crazyflow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-crazyflow
          path: results/crazyflow
          if-no-files-found: warn

  webots:
    if: contains(format(',{0},', inputs.sims), ',webots,')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/sim_gate/stamp.sh start webots
      - name: Install Webots R2025a (deb) and software rendering
        id: install
        continue-on-error: true
        run: |
          mkdir -p results/webots
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 python3-numpy python3-pil wget
            wget -nv -O webots.deb https://github.com/cyberbotics/webots/releases/download/R2025a/webots_2025a_amd64.deb
            sudo apt-get install -y ./webots.deb
            echo "R2025a deb" > results/webots/version.txt
            ls /usr/local/webots | head -n 20
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a webots --version
          } 2>&1 | tee -a results/webots/log.txt
      - name: Stamp install
        if: always()
        run: |
          ok=0
          if [ "${{ steps.install.outcome }}" = success ]; then ok=1; fi
          bash tests/sim_gate/stamp.sh end webots $ok
      - name: Gate
        id: gate
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tests/sim_gate/webots_gate.py 2>&1 | tee -a results/webots/log.txt
      - name: Finalize
        if: always()
        run: python3 tests/sim_gate/common.py finalize webots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-webots
          path: results/webots
          if-no-files-found: warn

  px4_gazebo:
    if: contains(format(',{0},', inputs.sims), ',px4_gazebo,')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/sim_gate/stamp.sh start px4_gazebo
      - name: Get PX4-Autopilot, install its tools and Gazebo Harmonic, build SITL
        id: install
        continue-on-error: true
        run: |
          mkdir -p results/px4_gazebo
          set -o pipefail
          {
            sudo apt-get update
            git clone --branch "$PX4_TAG" --depth 1 --recurse-submodules --shallow-submodules https://github.com/PX4/PX4-Autopilot.git px4
            git -C px4 rev-parse HEAD | tee results/px4_gazebo/version.txt
            sudo apt-get install -y --no-install-recommends xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0
            bash px4/Tools/setup/ubuntu.sh --no-nuttx
            sudo apt-get install -y python3-gz-transport13 python3-gz-msgs10 python3-numpy python3-pil
            python3 -c "from gz.transport13 import Node; from gz.msgs10.image_pb2 import Image; print('gz python bindings ok')"
            gz sim --versions
          } 2>&1 | tee -a results/px4_gazebo/log.txt
          (cd px4 && make px4_sitl_default) > results/px4_gazebo/build.log 2>&1 || { tail -n 80 results/px4_gazebo/build.log | tee -a results/px4_gazebo/log.txt; exit 1; }
          tail -n 5 results/px4_gazebo/build.log | tee -a results/px4_gazebo/log.txt
      - name: Stamp install
        if: always()
        run: |
          ok=0
          if [ "${{ steps.install.outcome }}" = success ]; then ok=1; fi
          bash tests/sim_gate/stamp.sh end px4_gazebo $ok
      - name: Gate
        id: gate
        continue-on-error: true
        run: bash tests/sim_gate/px4_run.sh
      - name: Finalize
        if: always()
        run: python3 tests/sim_gate/common.py finalize px4_gazebo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-px4_gazebo
          path: results/px4_gazebo
          if-no-files-found: warn

  airsim:
    if: contains(format(',{0},', inputs.sims), ',airsim,')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/sim_gate/stamp.sh start airsim
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install AirSim binaries (Blocks, Africa_Savannah) and the python client
        id: install
        continue-on-error: true
        run: |
          mkdir -p results/airsim airsim_bin
          set -o pipefail
          {
            df -h /
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers libvulkan1 vulkan-tools libgl1 libgl1-mesa-dri libglu1-mesa \
              libsdl2-2.0-0 unzip libxi6 libxrandr2 libxcursor1 libxinerama1 libnss3 libasound2t64
            python -m venv .airsim-venv
            .airsim-venv/bin/pip install --upgrade pip
            .airsim-venv/bin/pip install msgpack-rpc-python numpy pillow opencv-python-headless
            .airsim-venv/bin/pip install --no-deps airsim==1.8.1
            .airsim-venv/bin/python -c "import airsim; print('airsim client', airsim.__version__)"
            echo "AirSim $AIRSIM_TAG (Blocks.zip, Africa_Savannah.zip), python client airsim 1.8.1" > results/airsim/version.txt
            for w in Blocks Africa_Savannah; do
              curl -fL --retry 5 -o "$w.zip" "https://github.com/microsoft/AirSim/releases/download/$AIRSIM_TAG/$w.zip"
              ls -l "$w.zip"
              mkdir -p "airsim_bin/$w" && unzip -q "$w.zip" -d "airsim_bin/$w" && rm "$w.zip"
              find "airsim_bin/$w" -maxdepth 3 | head -n 15
            done
            df -h /
          } 2>&1 | tee -a results/airsim/log.txt
      - name: Stamp install
        if: always()
        run: |
          ok=0
          if [ "${{ steps.install.outcome }}" = success ]; then ok=1; fi
          bash tests/sim_gate/stamp.sh end airsim $ok
      - name: Gate
        id: gate
        continue-on-error: true
        run: bash tests/sim_gate/airsim_run.sh
      - name: Finalize
        if: always()
        run: python3 tests/sim_gate/common.py finalize airsim
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-airsim
          path: results/airsim
          if-no-files-found: warn

  project_airsim:
    if: contains(format(',{0},', inputs.sims), ',project_airsim,')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/sim_gate/stamp.sh start project_airsim
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Project AirSim binaries (Blocks, LandscapeMountains) and the python client
        id: install
        continue-on-error: true
        run: |
          mkdir -p results/project_airsim pasim_bin
          set -o pipefail
          {
            df -h /
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers libvulkan1 vulkan-tools libgl1 libgl1-mesa-dri libglu1-mesa \
              libsdl2-2.0-0 unzip libxi6 libxrandr2 libxcursor1 libxinerama1 libnss3 libasound2t64
            git clone --depth 1 --branch "$PASIM_TAG" https://github.com/iamaisim/ProjectAirSim.git ProjectAirSim_src
            python -m venv .pasim-venv
            .pasim-venv/bin/pip install --upgrade pip
            .pasim-venv/bin/pip install projectairsim==1.0.1 numpy pillow
            .pasim-venv/bin/python -c "import projectairsim; print('projectairsim client ok')"
            echo "Project AirSim $PASIM_TAG (Blocks-Linux-1.0.1.zip, LandscapeMountains-Linux-1.0.1.zip), client projectairsim 1.0.1" > results/project_airsim/version.txt
            for w in Blocks LandscapeMountains; do
              curl -fL --retry 5 -o "$w.zip" "https://github.com/iamaisim/ProjectAirSim/releases/download/$PASIM_TAG/$w-Linux-1.0.1.zip"
              ls -l "$w.zip"
              mkdir -p "pasim_bin/$w" && unzip -q "$w.zip" -d "pasim_bin/$w" && rm "$w.zip"
              find "pasim_bin/$w" -maxdepth 3 | head -n 15
            done
            df -h /
          } 2>&1 | tee -a results/project_airsim/log.txt
      - name: Stamp install
        if: always()
        run: |
          ok=0
          if [ "${{ steps.install.outcome }}" = success ]; then ok=1; fi
          bash tests/sim_gate/stamp.sh end project_airsim $ok
      - name: Gate
        id: gate
        continue-on-error: true
        run: bash tests/sim_gate/projectairsim_run.sh
      - name: Finalize
        if: always()
        run: python3 tests/sim_gate/common.py finalize project_airsim
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-project_airsim
          path: results/project_airsim
          if-no-files-found: warn
