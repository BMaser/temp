name: Films Project AirSim

# Feature films of Project AirSim 1.0.1 on GitHub's free Linux machine (software Vulkan, -AllowCPUDevices).
# Triggered by a push to the branch films-pasim, or by hand. `films` = comma separated list of film ids (F01..F11); slice 1 knows F05 and F06.
on:
  push:
    branches: [films-pasim]
  workflow_dispatch:
    inputs:
      films:
        description: "film ids, comma separated"
        default: "F05,F06"
      rtf:
        description: "simulation clock speed (0.03 = 33 times slower than real time)"
        default: "0.03"
      frames:
        description: "pairs of pictures per condition"
        default: "40"
      extra:
        description: "extra arguments for the client (for example --shipped-chase)"
        default: ""

permissions:
  contents: read

env:
  PASIM_TAG: v1.0.1
  FILMS: ${{ github.event.inputs.films || 'F05,F06' }}
  RTF: ${{ github.event.inputs.rtf || '0.03' }}
  FRAMES: ${{ github.event.inputs.frames || '40' }}
  EXTRA: ${{ github.event.inputs.extra || '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          films = [x.strip() for x in os.environ["FILMS"].split(",") if x.strip()]
          print("matrix=" + json.dumps({"film": films}))
          EOF

  film:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages, Python client, Project AirSim 1.0.1
        run: |
          mkdir -p ev
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers libvulkan1 vulkan-tools libgl1 libgl1-mesa-dri libglu1-mesa \
            libsdl2-2.0-0 unzip libxi6 libxrandr2 libxcursor1 libxinerama1 libnss3 libasound2t64 ffmpeg
          python3 -m venv .pa
          .pa/bin/pip install -q projectairsim==1.0.1 numpy pillow
          .pa/bin/pip freeze > ev/pip_freeze.txt
          git clone --depth 1 --branch "$PASIM_TAG" https://github.com/iamaisim/ProjectAirSim.git ProjectAirSim_src
          curl -fL --retry 5 -sS -o Blocks.zip "https://github.com/iamaisim/ProjectAirSim/releases/download/$PASIM_TAG/Blocks-Linux-1.0.1.zip"
          ls -la Blocks.zip | tee ev/zip_size.txt
          mkdir -p pasim_bin && unzip -q Blocks.zip -d pasim_bin && rm Blocks.zip
          df -h / | tee ev/disk.txt
          python3 --version | tee ev/python_version.txt
          ffmpeg -version | head -n 1 | tee ev/ffmpeg_version.txt
          VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1) vulkaninfo --summary > ev/vulkaninfo_summary.txt 2>&1 || true
          dpkg -l | grep -i -E "mesa-vulkan|libvulkan" > ev/mesa_packages.txt || true
          nproc | tee ev/nproc.txt
      - name: Pictures of ${{ matrix.film }}
        continue-on-error: true
        run: |
          SIMCFG="$PWD/ProjectAirSim_src/client/python/example_user_scripts/sim_config"
          bash films_pasim/launch_film.sh "${{ matrix.film }}" "$PWD/out/${{ matrix.film }}" "$PWD/pasim_bin" "$SIMCFG" "$PWD/.pa/bin/python" \
            --rtf "$RTF" --frames "$FRAMES" $EXTRA
      - name: Film, contact sheets, film_result.json
        if: always()
        continue-on-error: true
        run: |
          .pa/bin/python films_pasim/make_film.py "${{ matrix.film }}" "$PWD/out/${{ matrix.film }}" 2>&1 | tee "out/${{ matrix.film }}/make_film.log"
          cp -r ev "out/${{ matrix.film }}/ev"
          echo "### ${{ matrix.film }}" >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 "out/${{ matrix.film }}/client.log" | cut -c1-300 >> "$GITHUB_STEP_SUMMARY" || true
          head -c 3000 "out/${{ matrix.film }}/film_result.json" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-${{ matrix.film }}
          path: out/${{ matrix.film }}
          if-no-files-found: warn

  overview:
    needs: film
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arts
          pattern: film-*
      - name: overview.png
        run: |
          pip install -q pillow
          mkdir -p ov
          python3 films_pasim/overview.py arts ov/overview.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overview
          path: ov
          if-no-files-found: warn
