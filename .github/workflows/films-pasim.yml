name: Films Project AirSim

# Feature films of Project AirSim 1.0.1 on GitHub's free Linux machine (software Vulkan, -AllowCPUDevices).
# Triggered by a push to the branch films-pasim, or by hand. `films` = comma separated list of film ids (F01..F11); slice 1 knows F05 and F06.
on:
  push:
    branches: [films-pasim]
  workflow_dispatch:
    inputs:
      films:
        description: "film ids, comma separated; FNN@variant for a variant (F05@gain)"
        default: ""
      rtf:
        description: "simulation clock speed (0.03 = 33 times slower than real time)"
        default: "0.03"
      frames:
        description: "pairs of pictures per condition"
        default: "40"
      rt15:
        description: "run the RT15 real-time camera probe (true/false)"
        default: "true"
      extra:
        description: "extra arguments for the client (for example --shipped-chase)"
        default: ""

permissions:
  contents: read

env:
  PASIM_TAG: v1.0.1
  FILMS: ${{ github.event.inputs.films || 'F01@cover,F02@cityenviron_min_sub,F02@neighborhood_min_sub,F03,F04,F07,F08,F09@strong,F10@spin,F11' }}
  RTF: ${{ github.event.inputs.rtf || '0.03' }}
  FRAMES: ${{ github.event.inputs.frames || '90' }}
  EXTRA: ${{ github.event.inputs.extra || '' }}
  RT15: ${{ github.event.inputs.rt15 || 'false' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      has_films: ${{ steps.m.outputs.has_films }}
    steps:
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          inc = []
          for it in [x.strip() for x in os.environ["FILMS"].split(",") if x.strip()]:
              fid, _, var = it.partition("@")   # "F05@gain" = film F05, variant gain
              flags = var.split("_")
              pkg = "Blocks"
              if "mountains" in flags or fid == "F01":
                  pkg = "LandscapeMountains"
              if "neighborhood" in flags:
                  pkg = "Neighborhood"
              if "cityenviron" in flags:
                  pkg = "CityEnviron"
              rtf = {"F11": "0.0125", "F07": "0.05", "F10": "0.05"}.get(fid, os.environ["RTF"])
              frames = {"F11": "150", "F07": "80", "F08": "100", "F09": "50", "F10": "60", "F04": "60"}.get(fid, os.environ["FRAMES"])
              speed = {"F11": "3.0", "F10": "8.0"}.get(fid, "1.5")
              if "spin" in flags:
                  rtf, frames = "1.0", "30"
              if fid == "F11":
                  rtf, frames = "0.04", "200"
              if fid == "F02" and "cityenviron" in flags:
                  rtf, frames, speed = "0.08", "70", "3.0"
              elif fid == "F02":
                  rtf, frames, speed = "0.04", "50", "1.2"
              cv = "r.DynamicGlobalIlluminationMethod 0,r.ReflectionMethod 0,r.Shadow.Virtual.Enable 0,r.ScreenPercentage 50,r.VolumetricCloud 0,r.Nanite 0"
              if "min" in flags:
                  cv += ",sg.ViewDistanceQuality 0,sg.ShadowQuality 0,sg.PostProcessQuality 0,sg.TextureQuality 0,sg.EffectsQuality 0,sg.FoliageQuality 0,sg.ShadingQuality 0,sg.GlobalIlluminationQuality 0,sg.ReflectionQuality 0"
              small = ("light" in flags) or ("min" in flags)
              extra = '-ExecCmds="' + cv + '"' if small else ""
              res = ["320", "180"] if small else ["640", "480"]
              inc.append({"film": fid, "variant": var or "default", "key": fid + ("-" + var if var else ""), "pkg": pkg, "rtf": rtf, "frames": frames, "speed": speed,
                          "uextra": extra, "rx": res[0], "ry": res[1]})
          print("matrix=" + json.dumps({"include": inc}))
          print("has_films=" + ("true" if inc else "false"))
          EOF

  film:
    needs: plan
    if: needs.plan.outputs.has_films == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages, Python client, Project AirSim 1.0.1
        run: |
          mkdir -p ev
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers libvulkan1 vulkan-tools libgl1 libgl1-mesa-dri libglu1-mesa \
            libsdl2-2.0-0 unzip libxi6 libxrandr2 libxcursor1 libxinerama1 libnss3 libasound2t64 ffmpeg
          python3 -m venv .pa
          .pa/bin/pip install -q projectairsim==1.0.1 numpy pillow matplotlib
          .pa/bin/pip freeze > ev/pip_freeze.txt
          git clone --depth 1 --branch "$PASIM_TAG" https://github.com/iamaisim/ProjectAirSim.git ProjectAirSim_src
          GH_TOKEN="${{ github.token }}" bash films_pasim/fetch_pkg.sh "${{ matrix.pkg }}" "$PWD/pasim_bin" "$PWD/ev"
          df -h / | tee ev/disk.txt
          python3 --version | tee ev/python_version.txt
          ffmpeg -version | head -n 1 | tee ev/ffmpeg_version.txt
          VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1) vulkaninfo --summary > ev/vulkaninfo_summary.txt 2>&1 || true
          dpkg -l | grep -i -E "mesa-vulkan|libvulkan" > ev/mesa_packages.txt || true
          nproc | tee ev/nproc.txt
      - name: Pictures of ${{ matrix.key }}
        continue-on-error: true
        run: |
          SIMCFG="$PWD/ProjectAirSim_src/client/python/example_user_scripts/sim_config"
          if [ "${{ matrix.film }}" = "F05" ] || [ "${{ matrix.film }}" = "F06" ]; then
            bash films_pasim/launch_film.sh "${{ matrix.film }}" "$PWD/out/${{ matrix.key }}" "$PWD/pasim_bin" "$SIMCFG" "$PWD/.pa/bin/python"               --rtf "$RTF" --frames "$FRAMES" --variant "${{ matrix.variant }}" $EXTRA
          else
            UNREAL_EXTRA='${{ matrix.uextra }}' UNREAL_RESX='${{ matrix.rx }}' UNREAL_RESY='${{ matrix.ry }}' CLIENT_SCRIPT=films2.py CLIENT_TIMEOUT=5600 bash films_pasim/launch_film.sh "${{ matrix.film }}" "$PWD/out/${{ matrix.key }}" "$PWD/pasim_bin" "$SIMCFG" "$PWD/.pa/bin/python"               --film "${{ matrix.film }}" --variant "${{ matrix.variant }}" --rtf "${{ matrix.rtf }}" --frames "${{ matrix.frames }}" --speed "${{ matrix.speed }}" $EXTRA
          fi
      - name: Film, contact sheets, film_result.json
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "out/${{ matrix.key }}"
          if [ "${{ matrix.film }}" = "F05" ] || [ "${{ matrix.film }}" = "F06" ]; then
            .pa/bin/python films_pasim/make_film.py "${{ matrix.film }}" "$PWD/out/${{ matrix.key }}" "${{ matrix.variant }}" 2>&1 | tee "out/${{ matrix.key }}/make_film.log"
          else
            .pa/bin/python films_pasim/make_film2.py "${{ matrix.film }}" "$PWD/out/${{ matrix.key }}" "${{ matrix.variant }}" 2>&1 | tee "out/${{ matrix.key }}/make_film.log"
          fi
          cp -r ev "out/${{ matrix.key }}/ev"
          echo "### ${{ matrix.key }}" >> "$GITHUB_STEP_SUMMARY"
          tail -n 30 "out/${{ matrix.key }}/client.log" | cut -c1-300 >> "$GITHUB_STEP_SUMMARY" || true
          head -c 2500 "out/${{ matrix.key }}/film_result.json" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-${{ matrix.key }}
          path: out/${{ matrix.key }}
          if-no-files-found: warn

  overview:
    needs: [plan, film]
    if: always() && needs.plan.outputs.has_films == 'true' 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arts
          pattern: film-*
      - name: overview.png
        run: |
          pip install -q pillow
          mkdir -p ov
          python3 films_pasim/overview.py arts ov/overview.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overview
          path: ov
          if-no-files-found: warn

  rt15:
    if: ${{ (github.event.inputs.rt15 || 'false') == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install (same as the film jobs, scene Blocks)
        run: |
          mkdir -p ev
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers libvulkan1 vulkan-tools libgl1 libgl1-mesa-dri libglu1-mesa             libsdl2-2.0-0 unzip libxi6 libxrandr2 libxcursor1 libxinerama1 libnss3 libasound2t64
          python3 -m venv .pa
          .pa/bin/pip install -q projectairsim==1.0.1 numpy pillow
          git clone --depth 1 --branch "$PASIM_TAG" https://github.com/iamaisim/ProjectAirSim.git ProjectAirSim_src
          curl -fL --retry 5 -sS -o Blocks.zip "https://github.com/iamaisim/ProjectAirSim/releases/download/$PASIM_TAG/Blocks-Linux-1.0.1.zip"
          mkdir -p pasim_bin && unzip -q Blocks.zip -d pasim_bin && rm Blocks.zip
          nproc | tee ev/nproc.txt; free -m | tee ev/memory.txt; lscpu | head -20 > ev/lscpu.txt
      - name: RT15 probe, two sizes, one Unreal start each
        continue-on-error: true
        run: |
          SIMCFG="$PWD/ProjectAirSim_src/client/python/example_user_scripts/sim_config"
          for SZ in 640x480 320x240; do
            CLIENT_SCRIPT=rt15.py CLIENT_TIMEOUT=900 bash films_pasim/launch_film.sh RT15 "$PWD/out/s$SZ" "$PWD/pasim_bin" "$SIMCFG" "$PWD/.pa/bin/python" --size "$SZ"
            pkill -KILL -f "Binaries/Linux/" 2>/dev/null || true; sleep 5
          done
          .pa/bin/python films_pasim/rt15_merge.py out | tee out/rt15_merge.log
          cp -r ev out/ev
          cat out/rt15.json | head -c 6000 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rt15
          path: out
          if-no-files-found: warn
