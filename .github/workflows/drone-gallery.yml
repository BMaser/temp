name: Drone gallery

# Pictures of every drone model that the simulator Crazyflow ships (cf2x_L250, cf2x_P250, cf2x_T350, cf21B_500 and
# hb_x500), each from eight sides, for a designer. Started by hand only. The install steps are the proven ones of
# track-look.yml (LSY checkout, Mesa, pixi); the gate model and the layout steps are not needed here because the test
# makes a Crazyflow Sim with one drone alone (no LSY environment, no gates).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LSY_REPO: learnsyslab/lsy_drone_racing
  LSY_COMMIT: ac7377baa1cfd8fef1bcdc31eeaebff382f453b7

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LSY_REPO }}
          ref: ${{ env.LSY_COMMIT }}
          path: lsy_drone_racing

      # MuJoCo loads libEGL / libOSMesa at run time. The pixi environment of lsy_drone_racing does
      # not contain them, and the runner has no graphics driver, so take Mesa's software drawing.
      - name: Install Mesa software drawing libraries
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libgles2 libosmesa6
          ldconfig -p | grep -E "libEGL|libOSMesa|libGL\.so" || true
          ls /usr/share/glvnd/egl_vendor.d || true

      # Same action, pixi version and options as the continuous integration of lsy_drone_racing
      # (.github/workflows/testing.yml). Cache is off so a cache problem cannot hide the test.
      - name: Setup pixi
        id: pixi
        continue-on-error: true
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.70.0
          manifest-path: lsy_drone_racing/pyproject.toml
          environments: default
          activate-environment: false
          locked: true
          cache: false

      # pixi activates the environment first. The sim feature of lsy_drone_racing builds acados
      # in that step (tools/setup_acados.sh), which takes a few minutes.
      - name: Run drone gallery test
        id: run
        continue-on-error: true
        run: |
          mkdir -p results/drone-gallery
          set -o pipefail
          pixi run --locked --manifest-path lsy_drone_racing/pyproject.toml -e default \
            python tests/crazyflow_drone_gallery.py \
              --out results/drone-gallery --lsy-commit "$LSY_COMMIT" \
            2>&1 | tee results/drone-gallery/run.log

      - name: Write summary
        if: always()
        run: |
          if [ -f results/drone-gallery/summary.md ]; then
            cat results/drone-gallery/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Drone gallery"
              echo
              echo "No result file was written. Outcome of the steps: pixi setup = ${{ steps.pixi.outcome }}, test = ${{ steps.run.outcome }}."
              echo
              echo '```'
              tail -n 40 results/drone-gallery/run.log 2>/dev/null || echo "no run.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drone-gallery-results
          path: results/drone-gallery
          if-no-files-found: warn

      # Only this step marks the job as failed. It reads the result file and applies the pass rule.
      - name: Apply pass rule
        if: always()
        run: python3 tests/crazyflow_drone_gallery.py --check results/drone-gallery/result.json
