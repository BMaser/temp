name: WARP Unreal test

# Test: can AirSim and Project AirSim (Unreal Engine) draw camera pictures on the free Windows machine
# (no graphics card) with Microsoft's software Direct3D 12 driver (WARP)? If yes, record short flight films.
# All files of this test live in warp_test/ and are removed after the test.

on:
  workflow_dispatch:
    inputs:
      sims:
        description: "airsim, projectairsim or both"
        required: false
        default: "both"
      cap_min:
        description: "Wall-time cap of the flight recording in minutes"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  airsim:
    if: inputs.sims == 'both' || inputs.sims == 'airsim'
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Python packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install msgpack-rpc-python numpy pillow opencv-python-headless imageio-ffmpeg psutil
          python -m pip install --no-deps --no-build-isolation airsim==1.8.1
          python -c "import airsim; print('airsim client', airsim.__version__)"
      - name: Machine report
        shell: bash
        run: |
          mkdir -p out/airsim
          python warp_test/machine_report.py out/airsim
          cat out/airsim/machine.txt | head -80
      - name: Download AirSim Blocks (Windows)
        shell: bash
        run: |
          mkdir -p bin
          curl.exe -fL --retry 5 -o Blocks.zip https://github.com/microsoft/AirSim/releases/download/v1.8.1-windows/Blocks.zip
          ls -l Blocks.zip
          7z x -y -obin Blocks.zip > unzip.log || tail -5 unzip.log
          tail -3 unzip.log
          find bin -maxdepth 5 > out/airsim/tree.txt; head -40 out/airsim/tree.txt
          df -h /c || true
      - name: Unreal prerequisites
        shell: bash
        continue-on-error: true
        run: |
          p=$(find bin -iname 'UE4PrereqSetup_x64.exe' | head -1)
          echo "prereq: $p"
          if [ -n "$p" ]; then MSYS2_ARG_CONV_EXCL="*" timeout 150 "$p" /quiet /norestart || echo "prereq exit $?"; fi
      - name: DirectX end-user runtime (AirSim showed the error "DirectX Runtime is required")
        shell: pwsh
        continue-on-error: true
        run: |
          curl.exe -fL --retry 5 -o dxredist.exe https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe
          Start-Process -Wait .\dxredist.exe -ArgumentList '/Q','/T:C:\dxtmp'
          Start-Process -Wait C:\dxtmp\DXSETUP.exe -ArgumentList '/silent'
          Get-ChildItem C:\Windows\System32\d3dx9_43.dll, C:\Windows\System32\xinput1_3.dll | Format-Table Name,Length
      - name: Run
        shell: bash
        continue-on-error: true
        run: python warp_test/airsim_run.py --bin bin --out out/airsim --cap-min "${{ inputs.cap_min }}" 2>&1 | tee out/airsim/run_log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warp-airsim
          path: out/airsim
          if-no-files-found: warn

  projectairsim:
    if: inputs.sims == 'both' || inputs.sims == 'projectairsim'
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install projectairsim==1.0.1 numpy pillow opencv-python-headless imageio-ffmpeg psutil
          python -c "import projectairsim; print('projectairsim client ok')"
          git clone --depth 1 --branch v1.0.1 https://github.com/iamaisim/ProjectAirSim.git ProjectAirSim_src
      - name: Machine report
        shell: bash
        run: |
          mkdir -p out/projectairsim
          python warp_test/machine_report.py out/projectairsim
          cat out/projectairsim/machine.txt | head -80
      - name: Download Project AirSim Blocks (Windows)
        shell: bash
        run: |
          mkdir -p bin
          curl.exe -fL --retry 5 -o Blocks.zip https://github.com/iamaisim/ProjectAirSim/releases/download/v1.0.1/Blocks-Windows-1.0.1.zip
          ls -l Blocks.zip
          7z x -y -obin Blocks.zip > unzip.log || tail -5 unzip.log
          tail -3 unzip.log
          find bin -maxdepth 5 > out/projectairsim/tree.txt; head -40 out/projectairsim/tree.txt
      - name: Unreal prerequisites
        shell: bash
        continue-on-error: true
        run: |
          p=$(find bin -iname 'UE*PrereqSetup_x64.exe' | head -1)
          echo "prereq: $p"
          if [ -n "$p" ]; then MSYS2_ARG_CONV_EXCL="*" timeout 150 "$p" /quiet /norestart || echo "prereq exit $?"; fi
      - name: Run
        shell: bash
        continue-on-error: true
        run: python warp_test/pasim_run.py --bin bin --src ProjectAirSim_src --out out/projectairsim --cap-min "${{ inputs.cap_min }}" 2>&1 | tee out/projectairsim/run_log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warp-projectairsim
          path: out/projectairsim
          if-no-files-found: warn
