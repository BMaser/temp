name: PX4 Gazebo base lap

# One x500 drone with a forward camera and a chase camera flies the route of the Webots base lap (four gates of the level 0 track,
# scaled by 4, passages 1, 2, 3, 4, 2) in PX4 v1.17.0 SITL with Gazebo Harmonic, world baylands, on the free runner
# (4 cores, no graphics card: Xvfb + Mesa software drawing). MAVSDK offboard setpoints. The job writes flight_result.json,
# three films, summary.md and result.json. See tests/px4_gazebo_base_run.py (run and outputs), tests/px4_gazebo_base_check.py
# (pass rule), px4_gazebo/px4_core.py (track, route, yaw plan).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PX4_TAG: v1.17.0

jobs:
  px4-gazebo-base:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Get PX4-Autopilot, install its tools, Gazebo Harmonic, ffmpeg and MAVSDK, build SITL
        id: install
        run: |
          set -e
          mkdir -p results
          sudo apt-get update
          git clone --branch "$PX4_TAG" --depth 1 --recurse-submodules --shallow-submodules https://github.com/PX4/PX4-Autopilot.git px4
          git -C px4 rev-parse HEAD | tee results/px4_version.txt
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 ffmpeg
          bash px4/Tools/setup/ubuntu.sh --no-nuttx
          sudo apt-get install -y python3-gz-transport13 python3-gz-msgs10 python3-numpy python3-scipy python3-pil python3-venv
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install mavsdk numpy scipy pillow
          .venv/bin/python -c "import mavsdk, numpy, scipy, PIL; from gz.transport13 import Node; from gz.msgs10.pose_v_pb2 import Pose_V; from gz.msgs10.image_pb2 import Image; print('mavsdk', mavsdk.__file__, 'numpy', numpy.__version__, 'scipy', scipy.__version__, 'gz bindings ok')" | tee results/python_versions.txt
          .venv/bin/pip list 2>/dev/null | grep -i -E "mavsdk|grpc|protobuf|numpy|scipy|pillow" | tee -a results/python_versions.txt
          gz sim --versions | tee results/gz_version.txt
          ffmpeg -version | head -n 1
          (cd px4 && make px4_sitl_default) > results/build.log 2>&1 || { tail -n 80 results/build.log; exit 1; }
          tail -n 3 results/build.log

      - name: Offline checks (track and route, yaw plan, result writer)
        id: unit
        continue-on-error: true
        run: |
          mkdir -p results
          set -o pipefail
          {
            .venv/bin/python tests/test_px4_core.py
            .venv/bin/python tests/test_nose_yaw.py | tail -n 3
            .venv/bin/python tests/test_flight_result.py | tail -n 3
          } 2>&1 | tee results/offline_checks.log

      - name: Fly the lap in PX4 and Gazebo and make the films and the result file
        id: fly
        continue-on-error: true
        run: |
          mkdir -p results
          set -o pipefail
          .venv/bin/python tests/px4_gazebo_base_run.py run --out results --px4 px4 2>&1 | tee results/run.log

      - name: Apply pass rule
        id: check
        if: always()
        continue-on-error: true
        run: |
          mkdir -p results
          set -o pipefail
          .venv/bin/python tests/px4_gazebo_base_check.py --out results 2>&1 | tee results/check.log

      - name: Job summary
        if: always()
        run: |
          if [ -f results/summary.md ]; then cat results/summary.md >> "$GITHUB_STEP_SUMMARY"; else echo "No summary.md was written (fly step: ${{ steps.fly.outcome }})." >> "$GITHUB_STEP_SUMMARY"; fi
          df -h / | tail -n 1

      - name: Remove files that are not results
        if: always()
        run: |
          rm -f results/*.rgb
          for f in results/sim.log; do [ -f "$f" ] && tail -n 400 "$f" > results/sim_tail.log && if [ "$(stat -c %s "$f")" -gt 20000000 ]; then rm -f "$f"; fi; done
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: px4-gazebo-base-results
          path: results/
          if-no-files-found: warn

      - name: Fail the job when the check failed
        if: always()
        run: |
          test "${{ steps.check.outcome }}" = success
