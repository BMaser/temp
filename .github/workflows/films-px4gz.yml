name: PX4 Gazebo race film FR

# ONE film: the hard race route (hard_race_v1.json, scale 4) in a generated city, PX4 v1.17.0 SITL + Gazebo Harmonic, x500 with a nose camera, depth,
# object labels and a chase camera, six timed phases (city, wind + turbulence, rain, camera noise, motion blur, night + clouds), then the landing.
# Free runner (4 cores, no graphics card): Xvfb + Mesa software drawing. See tests/px4_gazebo_fr_run.py (run, early, post) and px4_gazebo/race_*.py.
# The film is made in the BACKGROUND; a second step waits for the first 16 simulated seconds, makes the early frames and uploads them as the artifact
# `early-frames` while the film goes on (owner's order 2026-10-17). The RT15 probe is not part of this job.
# Runs on push to the branch films-px4gz only (and by hand).

on:
  push:
    branches: [films-px4gz]
  workflow_dispatch:

permissions:
  contents: read

env:
  PX4_TAG: v1.17.0

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4

      - name: Get PX4-Autopilot, install its tools, Gazebo Harmonic, ffmpeg and MAVSDK, build SITL
        run: |
          set -e
          mkdir -p results
          sudo apt-get update
          git clone --branch "$PX4_TAG" --depth 1 --recurse-submodules --shallow-submodules https://github.com/PX4/PX4-Autopilot.git px4
          git -C px4 rev-parse HEAD | tee results/px4_version.txt
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 ffmpeg
          bash px4/Tools/setup/ubuntu.sh --no-nuttx
          sudo apt-get install -y python3-gz-transport13 python3-gz-msgs10 python3-numpy python3-scipy python3-pil python3-venv
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install 'mavsdk<4' numpy scipy pillow
          .venv/bin/python -c "import mavsdk, numpy, scipy, PIL; from gz.transport13 import Node; from gz.msgs10.pose_v_pb2 import Pose_V; from gz.msgs10.image_pb2 import Image; from gz.msgs10.light_pb2 import Light; from gz.msgs10.wind_pb2 import Wind; from gz.msgs10.entity_wrench_pb2 import EntityWrench; from gz.msgs10.entity_plugin_v_pb2 import EntityPlugin_V; from gz.msgs10.entity_factory_pb2 import EntityFactory; print('mavsdk', mavsdk.__file__, 'numpy', numpy.__version__, 'scipy', scipy.__version__, 'pillow', PIL.__version__, 'gz bindings ok')" | tee results/python_versions.txt
          gz sim --versions | tee results/gz_version.txt
          ffmpeg -version | head -n 1
          (cd px4 && make px4_sitl_default) > results/build.log 2>&1 || { tail -n 80 results/build.log; exit 1; }
          tail -n 3 results/build.log

      - name: Offline checks (route, city, picture code)
        run: |
          set -o pipefail
          { python3 tests/check_undefined_names.py tests/px4_gazebo_fr_run.py tests/px4_gazebo_base_run.py px4_gazebo/race_film.py px4_gazebo/race_world.py px4_gazebo/race_core.py; .venv/bin/python tests/test_race_world.py; RACE_FILM_NO_FFMPEG=1 .venv/bin/python tests/test_race_film.py; } 2>&1 | tee results/offline_checks.log

      - name: Start the film in the background
        run: |
          mkdir -p results
          rm -f results/run.exit results/post.exit
          setsid nohup bash -c '.venv/bin/python tests/px4_gazebo_fr_run.py run --out results --px4 px4 > results/run.log 2>&1; echo $? > results/run.exit; .venv/bin/python tests/px4_gazebo_fr_run.py post --out results > results/post.log 2>&1; echo $? > results/post.exit' > /dev/null 2>&1 &
          sleep 5
          echo "film started in the background"

      - name: Night test sheet (as soon as the night test is done, before take-off)
        timeout-minutes: 25
        run: |
          mkdir -p results/early
          t0=$(date +%s)
          while [ ! -f results/night_test.json ] && [ ! -f results/run.exit ]; do
            sleep 10
            if [ $(( $(date +%s) - t0 )) -gt 1200 ]; then echo "no night test after 20 minutes"; break; fi
          done
          if [ -f results/night_test.json ]; then
            sleep 5
            .venv/bin/python tests/px4_gazebo_fr_run.py nightsheet --out results 2>&1 | tail -n 20 || true
          fi
          ls -la results/early
          tail -n 12 results/run.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: night-test-sheet
          path: results/early/
          if-no-files-found: warn

      - name: Early frames (wait for the first 16 simulated seconds of the flight)
        timeout-minutes: 60
        run: |
          mkdir -p results/early
          python3 - <<'PYEOF'
          import json, os, time, subprocess, sys
          t0 = time.time()
          LIMIT = 22 * 60          # no arm command after 22 minutes = something is stuck: give up, keep the logs
          def tail(path, n):
              try:
                  return ' | '.join(open(path, errors='replace').read().splitlines()[-n:])[-400:]
              except Exception:
                  return ''
          ok = False
          while time.time() - t0 < LIMIT:
              ta, last = None, None
              try:
                  d = json.load(open('results/live.json'))
                  ta = d.get('arm_sim_s')
                  ts = d['panel_times'].get('chase') or []
                  last = ts[-1] if ts else None
                  if ta is not None and last is not None and last >= ta + 16.5:
                      ok = True
                      break
              except Exception:
                  pass
              if os.path.exists('results/run.exit'):
                  print('film process ended early, exit', open('results/run.exit').read().strip())
                  break
              print(f"{round(time.time() - t0)} s: arm {ta}, last chase picture {last}; run.log: {tail('results/run.log', 2)}", flush=True)
              time.sleep(30)
          print('waited', round(time.time() - t0), 's, ok =', ok)
          if not ok:
              open('results/early/GAVE_UP.txt', 'w').write('no early frames: see run.log and sim_tail.log in this folder')
              for f in ('results/run.log', 'results/sim.log', 'results/child.json', 'results/live.json', 'results/mavsdk_server.log'):
                  if os.path.exists(f):
                      subprocess.run(['bash', '-c', f'tail -n 400 {f} > results/early/{os.path.basename(f)}.tail'])
              sys.exit(1)
          PYEOF
          .venv/bin/python tests/px4_gazebo_fr_run.py early --out results 2>&1 | tail -n 30
          ls -la results/early

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: early-frames
          path: results/early/
          if-no-files-found: warn

      - name: Wait for the film and its post-processing to end
        timeout-minutes: 150
        run: |
          t0=$(date +%s)
          while [ ! -f results/post.exit ]; do
            sleep 20
            if [ $(( $(date +%s) - t0 )) -gt 8400 ]; then echo "film did not end in time"; exit 1; fi
          done
          echo "run exit $(cat results/run.exit 2>/dev/null), post exit $(cat results/post.exit)"
          tail -n 5 results/run.log || true
          test "$(cat results/post.exit)" = "0"

      - name: Job summary
        if: always()
        run: |
          if [ -f results/summary.md ]; then cat results/summary.md >> "$GITHUB_STEP_SUMMARY"; else echo "No summary.md." >> "$GITHUB_STEP_SUMMARY"; fi
          df -h / | tail -n 1

      - name: Remove files that are not results
        if: always()
        run: |
          rm -rf results/_backup results/assets
          rm -f results/*.raw results/poses_live*.npy results/live.tmp
          for f in results/sim.log; do [ -f "$f" ] && tail -n 600 "$f" > "${f%.log}_tail.log" && if [ "$(stat -c %s "$f")" -gt 4000000 ]; then rm -f "$f"; fi; done
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: px4-gazebo-films-results
          path: results/
          if-no-files-found: warn
